<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Weather Finder</title>    <link rel="stylesheet" href="styles.css"></head><body>    <h1>Real-Time Weather Finder ⛅</h1>    <div class="search-box">        <input type="text" id="cityInput" placeholder="Enter a city (e.g., Toronto)">        <button onclick="getWeather()">Search</button>    </div>    <div id="weatherResult" class="result"></div>    <script src="script.js"></script></body></html>
